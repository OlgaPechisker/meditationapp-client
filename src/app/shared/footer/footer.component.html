<footer class="footer">
  <div class="footer__container">
    <p class="footer__copyright">© {{ currentYear }} עינת שומונוב</p>
    <div class="footer__links">
      @if (whatsapp.contactLink(); as link) {
        <a [href]="link" target="_blank" rel="noopener" aria-label="WhatsApp">
          WhatsApp
        </a>
      } @else if (whatsapp.error()) {
        <span role="status">WhatsApp אינו זמין כרגע</span>
      }
    </div>
  </div>
</footer>
