name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- --watch=false --browsers=ChromeHeadless
      - run: npm audit --omit=dev --audit-level=high
      - name: Start SSR server
        run: npm run serve:ssr:client &
      - name: Smoke test SSR startup
        uses: ./.github/actions/wait-for-url
        with:
          url: http://localhost:4000/

  e2e:
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: einat_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d einat_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/einat_test
      JWT_SECRET: ci-jwt-secret-not-for-production
      JWT_ISSUER: ci-einat-api
      JWT_AUDIENCE: ci-einat-admin
      ADMIN_PASSWORD: ci-admin-password
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/checkout@v5
        with:
          repository: OlgaPechisker/meditationapp
          ref: main
          path: backend-e2e
      - name: Install and prepare backend
        working-directory: backend-e2e
        run: |
          npm ci
          npm exec --workspace=server -- prisma generate
          npm exec --workspace=server -- prisma migrate deploy
          npm exec --workspace=server -- prisma db seed
          npm run build
      - name: Start backend
        working-directory: backend-e2e
        run: npm run start &
      - name: Start SSR client
        run: npm run serve:ssr:client &
      - uses: ./.github/actions/wait-for-url
        with:
          url: http://localhost:3000/api/health
      - uses: ./.github/actions/wait-for-url
        with:
          url: http://localhost:4000/
      - name: Install Playwright browsers
        working-directory: backend-e2e
        run: npm run e2e:install
      - name: Run end-to-end tests
        working-directory: backend-e2e
        run: npm run e2e
        env:
          APP_URL: http://localhost:4000
          API_URL: http://localhost:3000
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: backend-e2e/playwright-report
